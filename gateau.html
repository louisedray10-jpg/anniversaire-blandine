<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Le gâteau que tu veux manger 💙</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
font-family:"Quicksand",sans-serif;
background:linear-gradient(180deg,#4b8cff,#9fc4ff);
color:white;
text-align:center;
padding:25px;
min-height:100vh;
}

h1{
font-family:"Great Vibes",cursive;
font-size:55px;
}

.card{
background:rgba(255,255,255,.18);
padding:30px;
border-radius:30px;
margin-top:30px;
}

.option{
margin:25px 0;
font-size:22px;
}

textarea{
display:none;
width:100%;
height:120px;
padding:15px;
border:none;
border-radius:20px;
font-size:16px;
font-family:"Quicksand",sans-serif;
}

button{
margin-top:25px;
padding:18px 25px;
border:none;
border-radius:20px;
font-size:18px;
cursor:pointer;
}

.back{
display:inline-block;
margin-top:30px;
color:white;
text-decoration:none;
}

</style>

</head>

<body>

<h1>🎂 Le gâteau que tu veux manger 💙</h1>

<div class="card">

<div class="option">
<input type="radio" name="cake">
🍋 Une tarte au citron
</div>

<div class="option">
<input type="radio" name="cake">
🍫 Un gâteau au chocolat
</div>

<div class="option">
<input type="radio" name="cake">
🍪 Des cookies
</div>

<div class="option">
<input id="otherCake" type="radio" name="cake">
✍️ Autre
</div>

<textarea id="cakeBox" placeholder="Écris ton idée ici..."></textarea>

<button onclick="sendCake()">
Valider 💙
</button>

</div>

<a class="back" href="index.html">
⬅ Retour à l'accueil
</a>

<script>

document.getElementById("otherCake").addEventListener("click",()=>{

document.getElementById("cakeBox").style.display="block";

});

function sendCake(){

let choice="";

const options=document.querySelectorAll('input[name="cake"]');

if(options[0].checked){

choice="Une tarte au citron 🍋";

}

else if(options[1].checked){

choice="Un gâteau au chocolat 🍫";

}

else if(options[2].checked){

choice="Des cookies 🍪";

}

else if(options[3].checked){

choice=document.getElementById("cakeBox").value || "Autre ✍️";

}

const message=encodeURIComponent(

"💙 Coucou, personne la plus incroyable du monde 😌\n\n🎂 Voici le gâteau que je veux manger :\n\n"+choice

);

window.open(

"https://wa.me/33600000000?text="+message,

"_blank"

);

}

</script>

</body>

</html>
