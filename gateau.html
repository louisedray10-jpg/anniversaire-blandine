<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Le gâteau que tu veux manger 💙</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:"Quicksand",sans-serif;

background:linear-gradient(180deg,#4b8cff,#9fc4ff);

color:white;

text-align:center;

padding:25px;

overflow-x:hidden;

min-height:100vh;

}

.heart{

position:fixed;

top:-50px;

font-size:22px;

pointer-events:none;

animation:fall linear forwards;

}

@keyframes fall{

from{

transform:translateY(-100px);

opacity:1;

}

to{

transform:translateY(120vh);

opacity:0;

}

}

h1{

font-family:"Great Vibes",cursive;

font-size:55px;

margin-top:20px;

}

.card{

background:rgba(255,255,255,.18);

padding:30px;

border-radius:30px;

margin-top:30px;

}

.option{

margin:25px 0;

font-size:22px;

}

textarea{

display:none;

width:100%;

height:120px;

margin-top:20px;

padding:15px;

border:none;

border-radius:20px;

font-size:16px;

font-family:"Quicksand",sans-serif;

}

button{

margin-top:25px;

padding:18px 25px;

border:none;

border-radius:20px;

font-size:18px;

cursor:pointer;

}

#message{

display:none;

margin-top:25px;

font-size:22px;

font-weight:bold;

}

.back{

display:inline-block;

margin-top:30px;

color:white;

text-decoration:none;

}

</style>

</head>

<body>

<h1>

🎂 Le gâteau que tu veux manger 💙

</h1>

<div class="card">

<div class="option">

<input type="radio" name="cake">

🍋 Une tarte au citron

</div>

<div class="option">

<input type="radio" name="cake">

🍫 Un gâteau au chocolat

</div>

<div class="option">

<input type="radio" name="cake">

🍪 Des cookies

</div>

<div class="option">

<input id="otherCake" type="radio" name="cake">

✍️ Autre

</div>

<textarea

id="cakeBox"

placeholder="Écris ton idée ici...">

</textarea>

<button id="validate">

Valider 💙

</button>

<div id="message">

💙 Réponse envoyée à la personne la plus incroyable du monde.

</div>

</div>

<a class="back" href="index.html">

⬅ Retour à l'accueil

</a>

<script>

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML=Math.random()>0.5?"💙":"🤍";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(heart);

setTimeout(()=>{

heart.remove();

},8000);

}

setInterval(createHeart,500);

document.getElementById("otherCake")

.addEventListener("click",()=>{

document.getElementById("cakeBox")

.style.display="block";

});

document.getElementById("validate")

.addEventListener("click",()=>{

document.getElementById("message")

.style.display="block";

});

</script>

</body>

</html>
