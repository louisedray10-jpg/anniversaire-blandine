<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Idée de p'tit date 💙</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
font-family:"Quicksand",sans-serif;
background:linear-gradient(180deg,#4b8cff,#9fc4ff);
color:white;
text-align:center;
padding:25px;
min-height:100vh;
}

h1{
font-family:"Great Vibes",cursive;
font-size:55px;
}

.card{
background:rgba(255,255,255,.18);
padding:30px;
border-radius:30px;
margin-top:30px;
}

.option{
margin:25px 0;
font-size:22px;
}

textarea{
display:none;
width:100%;
height:120px;
padding:15px;
border:none;
border-radius:20px;
font-size:16px;
font-family:"Quicksand",sans-serif;
}

button{
margin-top:25px;
padding:18px 25px;
border:none;
border-radius:20px;
font-size:18px;
cursor:pointer;
}

.back{
display:inline-block;
margin-top:30px;
color:white;
text-decoration:none;
}

</style>

</head>

<body>

<h1>🌳 Idée de p'tit date 💙</h1>

<div class="card">

<div class="option">
<input type="radio" name="date">
🌳 Au parc toutes les deux
</div>

<div class="option">
<input type="radio" name="date">
🏠 Chez moiiii
</div>

<div class="option">
<input type="radio" name="date">
🎡 Je nous trouve une petite activitéeeeee
</div>

<div class="option">
<input id="otherIdea" type="radio" name="date">
✍️ T'as une autre idée ?
</div>

<textarea id="ideaBox" placeholder="Écris ton idée ici..."></textarea>

<button onclick="sendDate()">
Valider 💙
</button>

</div>

<a class="back" href="index.html">
⬅ Retour à l'accueil
</a>

<script>

document.getElementById("otherIdea").addEventListener("click",()=>{

document.getElementById("ideaBox").style.display="block";

});

function sendDate(){

let choice="";

const options=document.querySelectorAll('input[name="date"]');

if(options[0].checked){

choice="Au parc toutes les deux 🌳";

}

else if(options[1].checked){

choice="Chez moiiii 🏠";

}

else if(options[2].checked){

choice="Une petite activitéeeeee 🎡";

}

else if(options[3].checked){

choice=document.getElementById("ideaBox").value || "Une autre idée ✍️";

}

const message=encodeURIComponent(

"💙 Coucou, personne la plus incroyable du monde 😌\n\n🌳 Voici mon idée pour mon anniversaire :\n\n"+choice

);

window.open(

"https://wa.me/33665226473?text="+message,

"_blank"

);

}

</script>

</body>

</html>
